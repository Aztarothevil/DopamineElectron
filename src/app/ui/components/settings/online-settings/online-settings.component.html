<div class="p-4">
    <div class="title">{{ 'updates' | translate }}</div>
    <div>
        <app-toggle-switch [(isChecked)]="this.checkForUpdates"> {{ 'check-for-updates' | translate }} </app-toggle-switch>
    </div>
    <div>
        <app-toggle-switch class="mt-3" [(isChecked)]="this.settings.checkForUpdatesIncludesPreReleases">
            {{ 'also-check-for-pre-releases' | translate }}
        </app-toggle-switch>
    </div>
    <mat-divider class="my-4"></mat-divider>
    <div class="title">{{ 'lyrics' | translate }}</div>
    <div>
        <app-toggle-switch [(isChecked)]="this.downloadLyricsOnline">
            {{ 'download-lyrics-online' | translate }}
        </app-toggle-switch>
    </div>
</div>
